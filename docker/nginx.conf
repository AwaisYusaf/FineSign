# Serves the FineSign SPA and reverse-proxies API paths to the server service, so
# the browser sees a single origin (no CORS needed).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m; # allow document uploads
    server_tokens off;

    # The signer page is the thing worth attacking here: it renders a document and
    # collects a legally binding signature from someone following an emailed link.
    # Framing it makes clickjacking straightforward, so deny it outright.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Signing tokens live in the URL, so keep them out of anything a third party
    # could be handed, and forbid the APIs that would let injected script exfiltrate.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # The SPA and pdf.js are self-hosted; pdf.js needs blob: workers and canvas
    # images. `connect-src 'self'` keeps a compromised bundle from posting a
    # signing token off-origin. 'unsafe-inline' for styles only — the app sets
    # inline style attributes for field positions.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API + signer + docs routes → the API server.
    location /api/       { proxy_pass http://server:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /sign/      { proxy_pass http://server:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    # Swagger UI needs its own inline/eval-ish assets, so it is exempted from the
    # SPA's CSP rather than loosening the policy that protects the signer page.
    location /docs       { proxy_pass http://server:4000; proxy_set_header Host $host; add_header Content-Security-Policy "" always; }
    location /openapi.json { proxy_pass http://server:4000; proxy_set_header Host $host; }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
