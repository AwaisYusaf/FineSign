name: Bug report
description: Something in FineSign does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** report security vulnerabilities here — see
        [SECURITY.md](../blob/main/SECURITY.md) for private disclosure.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem. API calls or UI steps are both fine.
      placeholder: |
        1. POST /api/envelopes with …
        2. …
    validations:
      required: true
  - type: textarea
    id: gate
    attributes:
      label: Is the gate green?
      description: >
        Output of `npm run gate` (or just the summary line). A red gate on an
        unmodified checkout is itself worth reporting.
      render: text
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The commit SHA or release you are running.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it?
      options:
        - Local dev (npm start + vite)
        - Docker Compose
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: >
        Node version, OS, and the relevant FINESIGN_* settings — **with secrets
        redacted**. Storage backend (SQLite/Postgres) and PAdES level help a lot.
      render: text
